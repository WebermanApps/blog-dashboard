<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><meta name="robots" content="noindex,nofollow">
<title>Blog Deck | Max Weberman</title><link rel="icon" href="../favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Khand:wght@600;700&family=Hind:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--t:#C1502E;--l:#05668D;--j:#0B6E4F;--s:#D4A017;--b:#E5E5E5;--m:#737373}
*{box-sizing:border-box}body{margin:0;background:#fff;color:#0A0A0A;font-family:Hind,system-ui,sans-serif;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding:12px 16px calc(24px + env(safe-area-inset-bottom))}
h1,h2{font-family:Khand,sans-serif;font-weight:700;line-height:1.1;margin:0}
.top{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--b);padding-bottom:6px}
.top a{display:inline-flex;align-items:center;min-height:44px;color:var(--l);text-decoration:none;font-family:Khand;font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:.85rem;white-space:nowrap}
.top .sp{flex:1}.prog{color:var(--m);font-size:.85rem;white-space:nowrap}
.sub{min-height:44px;padding:0 16px;border:2px solid #171717;background:#171717;color:#fff;font:700 .9rem Khand,sans-serif;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
h1{font-size:1.9rem;margin:14px 0 2px}.lead{color:var(--m);margin:0 0 12px;font-size:.92rem}
.card{border:1px solid var(--b);border-top:4px solid var(--c,var(--l));border-radius:.75rem;padding:16px;box-shadow:0 1px 2px rgba(10,10,10,.04)}
.cat{display:inline-block;font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.1em;padding:3px 10px;border-radius:999px;background:#F5F5F5;box-shadow:inset 3px 0 0 var(--c,var(--l))}
.ctx{color:var(--m);font-size:.85rem;margin:8px 0 2px}.q{font-family:Khand,sans-serif;font-weight:700;font-size:1.45rem;line-height:1.15;margin:0 0 14px}
.rw{font-size:.72rem;color:var(--t);font-weight:600;margin-left:6px;text-transform:uppercase;letter-spacing:.08em}
.opts{display:grid;gap:8px}.opt{min-height:52px;padding:10px 14px;border:2px solid #171717;border-radius:999px;background:#fff;font:600 1rem Hind,sans-serif;cursor:pointer;text-align:center}
.opt[aria-pressed=true]{background:var(--c,var(--l));border-color:var(--c,var(--l));color:#fff}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.ghost{min-height:44px;padding:0 14px;border:1px solid var(--b);border-radius:999px;background:#fff;font:600 .9rem Hind,sans-serif;cursor:pointer;color:#0A0A0A}
textarea{width:100%;min-height:84px;margin-top:10px;padding:10px;border:1px solid var(--b);border-radius:.5rem;font:16px Hind,sans-serif}
.done{text-align:center;padding:30px 0}.done h2{font-size:2rem;margin-bottom:8px}.big{display:flex;align-items:center;justify-content:center;min-height:56px;margin:18px auto 10px;max-width:360px;background:var(--j);color:#fff;text-decoration:none;font:700 1.1rem Khand,sans-serif;letter-spacing:.12em;text-transform:uppercase;border-radius:0}
.msg{color:var(--m);min-height:1.4em;font-size:.9rem;margin-top:8px}
button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid var(--l);outline-offset:3px}
@media(min-width:900px){.opts{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}.wrap{padding-top:28px}}
</style></head><body><div class="wrap">
<div class="top"><a href="../#deck-launcher">&larr; Deck Building</a><span class="sp"></span><span class="prog" id="prog"></span><button class="sub" id="submit" type="button">Submit</button></div>
<main id="main"><p class="lead">Loading deck</p></main><p class="msg" id="msg" role="status"></p></div>
<script src="https://webermanapps.github.io/style-swipe/submit.js" defer></script>
<script>
(()=>{const C={topics:'#C1502E',drafts:'#05668D',checks:'#D4A017',style:'#0B6E4F'},L={topics:'Topic Picks',drafts:'Draft Feedback',checks:'Open Checks',style:'Writing Style'};
let D,K,S,order,i=0;const $=id=>document.getElementById(id),el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const save=()=>localStorage.setItem(K,JSON.stringify(S));
const left=()=>D.cards.filter(c=>!S.sent.includes(c.id));
const answered=c=>S.a[c.id]&&(S.a[c.id].choice||S.a[c.id].note);
function show(){const L2=left();$('prog').textContent=(D.total-L2.length+L2.filter(answered).length)+' / '+D.total;
 order=L2.filter(c=>!answered(c)&&!S.skip.includes(c.id)).concat(L2.filter(c=>!answered(c)&&S.skip.includes(c.id)));
 const m=$('main');m.textContent='';
 if(!order.length){m.append(el('h1','',L2.length?'All Cards Answered':'Deck Done'),el('p','lead',L2.length?'Press Submit to send your answers to Blog.':'Everything was sent.'));if(!L2.length)doneScreen(false);return}
 const c=order[0];m.append(el('h1','',D.name),el('p','lead','Answer, skip, or add a note. Submit any time.'));
 const k=el('section','card');k.style.setProperty('--c',C[c.cat]);const cat=el('span','cat',L[c.cat]);k.append(cat);if(c.reworded)k.append(el('span','rw','Reworded'));
 k.append(el('p','ctx',c.ctx),el('p','q',c.q));const o=el('div','opts');const a=S.a[c.id]||(S.a[c.id]={});
 c.opts.forEach(t=>{const b=el('button','opt',t);b.type='button';b.setAttribute('aria-pressed',a.choice===t);b.onclick=()=>{a.choice=t;S.skip=S.skip.filter(x=>x!==c.id);save();show()};o.append(b)});k.append(o);
 const r=el('div','row'),nb=el('button','ghost',a.note?'Edit Note':'Add Note'),sk=el('button','ghost','Skip');nb.type=sk.type='button';r.append(nb,sk);k.append(r);
 const ta=el('textarea');ta.placeholder='Optional note for Blog';ta.value=a.note||'';ta.hidden=!a.note;ta.setAttribute('aria-label','Note');
 ta.oninput=()=>{a.note=ta.value;save()};nb.onclick=()=>{ta.hidden=false;ta.focus()};
 const nx=el('button','ghost','Next');nx.type='button';nx.hidden=!a.note;ta.addEventListener('input',()=>nx.hidden=!ta.value.trim());nx.onclick=()=>{S.skip=S.skip.filter(x=>x!==c.id);save();show()};r.append(nx);
 sk.onclick=()=>{if(!S.skip.includes(c.id))S.skip.push(c.id);save();if(order.length>1){const z=order.shift();order.push(z)}show()};k.append(ta);m.append(k)}
function doneScreen(sent,n){const m=$('main');m.textContent='';const d=el('div','done');d.append(el('h2','',sent?'Sent to Blog':'Deck Done'),el('p','lead',sent?n+' answers sent. Answered cards are gone; anything you skipped comes back reworded in your next deck.':'Nothing left in this deck.'));
 const b=el('a','big','Back to Deck Building');b.href='../#deck-launcher';d.append(b);if(left().length){const g=el('button','ghost','Keep Going');g.type='button';g.onclick=show;d.append(g)}m.append(d);$('prog').textContent=''}
$('submit').onclick=async()=>{const L2=left(),ans=L2.filter(answered);if(!ans.length){$('msg').textContent='Answer or note at least one card first.';return}
 const cards={};ans.forEach(c=>cards[c.id]={cat:c.cat,q:c.q,ctx:c.ctx,choice:S.a[c.id].choice||'',note:S.a[c.id].note||''});
 const un=L2.filter(c=>!answered(c)).map(c=>c.id),results={deck:D.id,categories:[...new Set(D.cards.map(c=>c.cat))],cards,skipped:S.skip.filter(x=>un.includes(x)),unanswered:un,partial:un.length>0,total:D.total};
 const b=$('submit');b.disabled=true;b.textContent='Sending';const ok=window.MWSubmit&&await MWSubmit.send({agent:'blog',app:'blog-deck',deck:D.id,results,notes:'',partial:un.length>0,answered:ans.length,total:D.total,unanswered:un});
 b.disabled=false;b.textContent='Submit';if(ok){S.sent.push(...ans.map(c=>c.id));save();doneScreen(true,ans.length);$('msg').textContent=''}else $('msg').textContent=window.MWSubmit&&MWSubmit.blocked?'Password needed. Nothing was sent.':'Not sent yet. It will retry when you are back online.'};
fetch('deck.json?'+Date.now()).then(r=>r.json()).then(j=>{D=j;K='blog-deck-'+D.id;S=JSON.parse(localStorage.getItem(K)||'null')||{a:{},skip:[],sent:[]};show()}).catch(()=>{$('main').textContent='Deck not found.'})})();
</script><script src="../ptr.js?v=3" defer></script></body></html>
